<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#6cc4ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#6cc4ff" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6cc4ff"/>
    </marker>
    <marker id="arrow-rework" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#eb6834"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#0b1f3a"/>
  <rect width="1200" height="630" fill="url(#major)"/>
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#6cc4ff" stroke-opacity="0.6" stroke-width="1.5"/>
  <rect x="26" y="26" width="1148" height="578" fill="none" stroke="#6cc4ff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Band 1: one change through six gates -->
  <text x="50" y="62" font-size="15" fill="#6cc4ff" letter-spacing="1">1 · ONE CHANGE, SIX GATES</text>

  <!-- flow line, thinning by 0.9 at every gate -->
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-linecap="butt">
    <line x1="70" y1="160" x2="95" y2="160" stroke-width="10"/>
    <line x1="205" y1="160" x2="235" y2="160" stroke-width="9"/>
    <line x1="345" y1="160" x2="375" y2="160" stroke-width="8.1"/>
    <line x1="485" y1="160" x2="515" y2="160" stroke-width="7.3"/>
    <line x1="625" y1="160" x2="655" y2="160" stroke-width="6.6"/>
    <line x1="765" y1="160" x2="795" y2="160" stroke-width="5.9"/>
    <line x1="905" y1="160" x2="1004" y2="160" stroke-width="5.3"/>
  </g>
  <circle cx="60" cy="160" r="11" fill="#0b1f3a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="60" cy="160" r="4" fill="#ffffff"/>

  <!-- stations -->
  <g font-size="14" text-anchor="middle">
    <g>
      <rect x="95" y="125" width="110" height="70" fill="#0b1f3a" stroke="#2a78d6" stroke-width="2"/>
      <rect x="95" y="125" width="110" height="6" fill="#2a78d6"/>
      <text x="150" y="166" fill="#ffffff">DESIGN</text>
      <text x="150" y="113" fill="#6cc4ff" font-size="13">pass 0.9</text>
    </g>
    <g>
      <rect x="235" y="125" width="110" height="70" fill="#0b1f3a" stroke="#eb6834" stroke-width="2"/>
      <rect x="235" y="125" width="110" height="6" fill="#eb6834"/>
      <text x="290" y="166" fill="#ffffff">IMPLEMENT</text>
      <text x="290" y="113" fill="#6cc4ff" font-size="13">pass 0.9</text>
    </g>
    <g>
      <rect x="375" y="125" width="110" height="70" fill="#0b1f3a" stroke="#eb6834" stroke-width="2"/>
      <rect x="375" y="125" width="110" height="6" fill="#eb6834"/>
      <text x="430" y="166" fill="#ffffff">REVIEW</text>
      <text x="430" y="113" fill="#6cc4ff" font-size="13">pass 0.9</text>
    </g>
    <g>
      <rect x="515" y="125" width="110" height="70" fill="#0b1f3a" stroke="#1baf7a" stroke-width="2"/>
      <rect x="515" y="125" width="110" height="6" fill="#1baf7a"/>
      <text x="570" y="166" fill="#ffffff">TEST</text>
      <text x="570" y="113" fill="#6cc4ff" font-size="13">pass 0.9</text>
    </g>
    <g>
      <rect x="655" y="125" width="110" height="70" fill="#0b1f3a" stroke="#eda100" stroke-width="2"/>
      <rect x="655" y="125" width="110" height="6" fill="#eda100"/>
      <text x="710" y="166" fill="#ffffff">MERGE</text>
      <text x="710" y="113" fill="#6cc4ff" font-size="13">pass 0.9</text>
    </g>
    <g>
      <rect x="795" y="125" width="110" height="70" fill="#0b1f3a" stroke="#eda100" stroke-width="2"/>
      <rect x="795" y="125" width="110" height="6" fill="#eda100"/>
      <text x="850" y="166" fill="#ffffff">RELEASE</text>
      <text x="850" y="113" fill="#6cc4ff" font-size="13">pass 0.9</text>
    </g>
  </g>

  <!-- reject chutes into the rework return -->
  <g stroke="#eb6834" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <line x1="150" y1="195" x2="150" y2="232"/>
    <line x1="290" y1="195" x2="290" y2="232"/>
    <line x1="430" y1="195" x2="430" y2="232"/>
    <line x1="570" y1="195" x2="570" y2="232"/>
    <line x1="710" y1="195" x2="710" y2="232"/>
    <line x1="850" y1="195" x2="850" y2="232"/>
    <path d="M850 232H60V176" marker-end="url(#arrow-rework)"/>
  </g>
  <text x="470" y="256" font-size="14" fill="#eb6834" text-anchor="middle">rework rejoins the same queue as new work</text>

  <!-- yield gauge -->
  <text x="1065" y="98" font-size="13" fill="#6cc4ff" text-anchor="middle">end to end</text>
  <circle cx="1065" cy="160" r="48" fill="#0b1f3a" stroke="#ffffff" stroke-opacity="0.2" stroke-width="8"/>
  <path d="M1065 112A48 48 0 1 1 1056 207.15" fill="none" stroke="#1baf7a" stroke-width="8"/>
  <text x="1065" y="166" font-size="24" fill="#ffffff" text-anchor="middle">0.53</text>
  <text x="1065" y="186" font-size="13" fill="#6cc4ff" text-anchor="middle">clean</text>
  <text x="1065" y="236" font-size="14" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">0.9<tspan font-size="10" dy="-7">6</tspan><tspan dy="7"> ≈ 0.53</tspan></text>

  <!-- band divider -->
  <line x1="40" y1="286" x2="1160" y2="286" stroke="#6cc4ff" stroke-opacity="0.45" stroke-dasharray="2 6"/>

  <!-- Band 2: many changes in flight, one convergence -->
  <text x="50" y="320" font-size="15" fill="#6cc4ff" letter-spacing="1">2 · MANY IN FLIGHT, ONE CONVERGENCE</text>

  <!-- main trunk -->
  <line x1="60" y1="370" x2="700" y2="370" stroke="#ffffff" stroke-opacity="0.85" stroke-width="6"/>
  <line x1="790" y1="370" x2="818" y2="370" stroke="#ffffff" stroke-opacity="0.85" stroke-width="6"/>
  <path d="M816 361L834 370L816 379z" fill="#ffffff" fill-opacity="0.85"/>
  <text x="60" y="356" font-size="14" fill="#ffffff">main</text>

  <!-- snapshot ticks -->
  <g font-size="13" fill="#6cc4ff" text-anchor="middle">
    <text x="130" y="356">t1</text>
    <text x="200" y="356">t2</text>
    <text x="270" y="356">t3</text>
    <text x="340" y="356">t4</text>
    <text x="410" y="356">t5</text>
  </g>
  <text x="490" y="356" font-size="13" fill="#6cc4ff">← snapshots taken</text>

  <!-- lanes: each branches from its snapshot, runs in parallel, converges on merge -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2">
    <path d="M130 370V402H600C650 402 650 378 700 378"/>
    <path d="M200 370V434H600C655 434 650 382 700 382"/>
    <path d="M270 370V466H600C660 466 650 386 700 386"/>
    <path d="M340 370V498H600C665 498 650 390 700 390"/>
    <path d="M410 370V530H600C670 530 650 394 700 394"/>
  </g>
  <g>
    <circle cx="130" cy="370" r="4" fill="#ffffff"/>
    <circle cx="200" cy="370" r="4" fill="#ffffff"/>
    <circle cx="270" cy="370" r="4" fill="#ffffff"/>
    <circle cx="340" cy="370" r="4" fill="#ffffff"/>
    <circle cx="410" cy="370" r="4" fill="#ffffff"/>
  </g>

  <!-- changes in flight, coloured by the stage each has reached -->
  <rect x="552" y="395" width="14" height="14" fill="#1baf7a"/>
  <rect x="482" y="427" width="14" height="14" fill="#eb6834"/>
  <rect x="430" y="491" width="14" height="14" fill="#eb6834"/>
  <rect x="452" y="523" width="14" height="14" fill="#2a78d6"/>

  <!-- clash on lane three -->
  <g stroke="#eb6834" stroke-width="3" stroke-linecap="round">
    <line x1="532" y1="458" x2="548" y2="474"/>
    <line x1="548" y1="458" x2="532" y2="474"/>
  </g>
  <text x="556" y="455" font-size="13" fill="#eb6834">clash</text>
  <path d="M532 474Q456 488 380 472" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-rework)"/>

  <!-- dimensions: L across the lanes, W along them -->
  <g stroke="#6cc4ff" stroke-width="1" fill="none">
    <line x1="88" y1="402" x2="88" y2="530" marker-start="url(#arrow-dim)" marker-end="url(#arrow-dim)"/>
    <line x1="80" y1="402" x2="125" y2="402" stroke-opacity="0.5"/>
    <line x1="80" y1="530" x2="125" y2="530" stroke-opacity="0.5"/>
    <line x1="410" y1="562" x2="600" y2="562" marker-start="url(#arrow-dim)" marker-end="url(#arrow-dim)"/>
    <line x1="410" y1="540" x2="410" y2="570" stroke-opacity="0.5"/>
    <line x1="600" y1="540" x2="600" y2="570" stroke-opacity="0.5"/>
  </g>
  <text x="72" y="471" font-size="18" fill="#6cc4ff" text-anchor="middle">L</text>
  <text x="505" y="588" font-size="14" fill="#6cc4ff" text-anchor="middle">W, time in flight</text>
  <text x="50" y="560" font-size="14" fill="#6cc4ff">L, changes in flight</text>

  <!-- merge manifold -->
  <rect x="700" y="345" width="90" height="62" fill="#0b1f3a" stroke="#eda100" stroke-width="2"/>
  <rect x="700" y="345" width="90" height="6" fill="#eda100"/>
  <text x="745" y="382" font-size="14" fill="#ffffff" text-anchor="middle">MERGE</text>

  <!-- legend -->
  <g font-size="13" fill="#ffffff" fill-opacity="0.85">
    <line x1="870" y1="322" x2="900" y2="322" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>
    <text x="912" y="327">accepted flow</text>
    <line x1="870" y1="348" x2="900" y2="348" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="912" y="353">rework</text>
    <g stroke="#eb6834" stroke-width="2.5" stroke-linecap="round">
      <line x1="879" y1="367" x2="891" y2="379"/>
      <line x1="891" y1="367" x2="879" y2="379"/>
    </g>
    <text x="912" y="378">snapshot overlap, p</text>
    <rect x="878" y="390" width="14" height="14" fill="#2a78d6"/>
    <text x="912" y="402">change in flight</text>
  </g>

  <!-- title block -->
  <g>
    <rect x="850" y="430" width="310" height="160" fill="#0b1f3a" stroke="#6cc4ff" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="850" y1="456" x2="1160" y2="456" stroke="#6cc4ff" stroke-opacity="0.5"/>
    <line x1="850" y1="508" x2="1160" y2="508" stroke="#6cc4ff" stroke-opacity="0.5"/>
    <line x1="850" y1="564" x2="1160" y2="564" stroke="#6cc4ff" stroke-opacity="0.5"/>
    <text x="862" y="448" font-size="12" fill="#6cc4ff">DWG 001 · SHEET 1 OF 1</text>
    <text x="1148" y="448" font-size="12" fill="#6cc4ff" text-anchor="end">2026-10-30</text>
    <text x="862" y="478" font-size="14" fill="#ffffff" font-weight="700">THE MATHS OF</text>
    <text x="862" y="498" font-size="14" fill="#ffffff" font-weight="700">SOFTWARE OWNERSHIP</text>
    <text x="862" y="530" font-size="14" fill="#ffffff">P(clean) ≈ (1−ε)·e<tspan font-size="10" dy="-7">−(pL+δW)</tspan></text>
    <text x="862" y="553" font-size="14" fill="#ffffff">L* = 1 / p</text>
    <text x="862" y="582" font-size="12" fill="#6cc4ff">aisdlclandscape.org/ownership</text>
  </g>
</svg>
