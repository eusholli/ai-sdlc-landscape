<svg width="202" height="202" viewBox="0 0 202 202" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Favicon-specific copy of the NeuBird iconmark.
     The brand iconmarks (neubird-iconmark-light/-sage.png) leave the bird as
     negative space, which needs a contrasting backdrop to read. A favicon has
     no such guarantee: it lands on Chrome's light tab strip, the near-white
     bookmarks bar, a dark tab strip, and an iOS home screen (where transparent
     pixels render black). So this copy fills the bird instead.

     Painted in two layers so the bird has no antialiasing seam: a full sage
     rounded square underneath, then the white square-with-bird-notch on top.
     What shows through the notch is the sage bird. -->
<rect width="202" height="202" rx="5.61523" fill="#2F4439"/>
