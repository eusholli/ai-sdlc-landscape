name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Against HEAD the locked-file check has nothing to compare, since people edit data/ by
      # hand; what CI gets is the check that no client component reaches the full dataset.
      - run: pnpm exec tsx scripts/guard.ts
      - run: pnpm build
      # Only on pull requests, and only for the records the pull request changes. A source that
      # refuses automated fetches (401, 403, 429) is reported as blocked and does not fail the run.
      - if: github.event_name == 'pull_request'
        run: pnpm data:links --changed
