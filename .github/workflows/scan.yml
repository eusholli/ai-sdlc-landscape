name: Scan for new tools

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - if: env.SERPER_API_KEY == ''
        run: echo "::warning::No SERPER_API_KEY secret, so no scan was run."
      - if: env.SERPER_API_KEY != ''
        uses: actions/checkout@v4
      - if: env.SERPER_API_KEY != ''
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - if: env.SERPER_API_KEY != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: env.SERPER_API_KEY != ''
        run: pnpm install --frozen-lockfile
      - if: env.SERPER_API_KEY != ''
        run: pnpm scan
      # GitHub caps an issue body at 65,536 characters; the list is cut short of that.
      - if: env.SERPER_API_KEY != ''
        run: |
          f=".scan/$(date -u +%F).md"
          head -c 60000 "$f" > body.md
          gh label create scan --color c5def5 --description "Weekly scan for new tools" --force
          gh issue create --title "Scan $(date -u +%F): candidates to judge" --label scan --body-file body.md
