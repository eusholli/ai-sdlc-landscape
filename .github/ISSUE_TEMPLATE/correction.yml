name: Suggest a correction
description: A fact on a tool is wrong, out of date or missing.
labels: [correction]
body:
  - type: input
    id: tool
    attributes:
      label: Tool
      description: The tool's name as it appears on the site.
    validations:
      required: true
  - type: input
    id: field
    attributes:
      label: Field
      description: Which fact, for example customers, pricing or deployment.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What it should say
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public source
      description: A link to a public page that states the fact. Corrections without one cannot be applied.
    validations:
      required: true
  - type: checkboxes
    id: vendor
    attributes:
      label: Affiliation
      options:
        - label: I work for the vendor of this tool.
